name: update readme

on:
  schedule: [{ cron: "0 6 * * *" }]  # todo dia às 3h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "users/${{ github.repository_owner }}/repos?sort=pushed&per_page=100" > "$RUNNER_TEMP/all.json"

      # windows, mac, linux, git + as 6 linguagens mais usadas; e os cartões dos 5 últimos repos
      - name: tech stack and latest repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_readme.py "$RUNNER_TEMP/all.json" "${{ github.repository_owner }}"

      - name: commit if changed
        run: |
          # commits as you, so the bot never shows up as a contributor
          git config user.name "pdr"
          git config user.email "53623485+ppdrada@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || (git commit -m "update readme" && git push)
