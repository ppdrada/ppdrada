name: update readme

on:
  schedule: [{ cron: "0 6 * * *" }]  # todo dia às 3h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "users/${{ github.repository_owner }}/repos?sort=pushed&per_page=100" > all.json

      - name: latest repos (terminal digitando)
        env:
          OWNER: ${{ github.repository_owner }}
          SKIP: "ppdrada"  # repos que não aparecem, separados por espaço
          LIMIT: "5"
        run: |
          jq -r --arg owner "$OWNER" --arg skip "$SKIP" --argjson limit "$LIMIT" '
            ($skip | split(" ")) as $s
            | [.[] | select(.fork | not) | select(.name as $n | $s | any(. == $n) | not)] | .[:$limit]
            | ([" $ ls ~/projects --latest"] + map(" › " + .name + (if .language then "  ·  " + (.language | ascii_downcase) else "" end))) as $lines  #   = espaço que o gerador não apaga
            | "<a href=\"https://github.com/\($owner)?tab=repositories\"><img src=\"https://readme-typing-svg.demolab.com?font=Fira+Code&size=15&duration=700&pause=400&color=A6ADC8&background=161B22&multiline=true&repeat=false&width=520&height=\(($lines | length) * 20 + 24)&lines=\($lines | map(@uri) | join(";"))\" alt=\"latest repos\" /></a>"
          ' all.json > repos.md

      - name: language icons
        env:
          TOOLS: "git,vscode"  # ferramentas fixas, sempre no fim
        run: |
          # python sempre primeiro, depois as linguagens que mais aparecem nos seus repos
          icons=$(jq -r '
            { "Python": "python", "JavaScript": "js,nodejs", "TypeScript": "ts", "C#": "cs",
              "Shell": "bash", "PowerShell": "powershell", "HTML": "html", "CSS": "css",
              "Java": "java", "Go": "go", "Rust": "rust", "C++": "cpp", "C": "c", "PHP": "php",
              "Kotlin": "kotlin", "Swift": "swift", "Dart": "dart", "Ruby": "ruby", "Lua": "lua" } as $map
            | [.[] | select(.fork | not) | .language | select(.)]
            | group_by(.) | sort_by(-length) | map(.[0])
            | ["Python"] + map(select(. != "Python"))
            | map($map[.] // empty) | join(",")
          ' all.json)
          echo "<img src=\"https://skillicons.dev/icons?i=$icons,$TOOLS&theme=dark\" height=\"34\" alt=\"languages and tools\" />" > skills.md

      - name: write between markers
        run: |
          replace() {  # $1 = nome do marcador, $2 = arquivo com o conteúdo novo
            awk -v m="$1" -v f="$2" '
              BEGIN { while ((getline l < f) > 0) r = r l "\n" }
              index($0, "<!-- " m ":start -->") { print; printf "%s", r; skip = 1; next }
              index($0, "<!-- " m ":end -->")   { skip = 0 }
              !skip' README.md > README.tmp && mv README.tmp README.md
          }
          replace repos repos.md
          replace skills skills.md
          rm all.json repos.md skills.md

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "update readme" && git push)
